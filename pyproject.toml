[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoyolo-trainer"
version = "0.1.0"
description = "Auto-labeling and active-learning training framework for Ultralytics YOLO11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3.0",
    "onnx>=1.16",
    "onnxslim>=0.1.82",
    "onnxruntime>=1.19",
    "tensorboard>=2.17",
    "opencv-python>=4.10",
    "numpy>=1.26,<3",
    "pillow>=10.4",
    "albumentations>=2.0",
    "scikit-image>=0.24",
    "ImageHash>=4.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "loguru>=0.7",
    "tqdm>=4.66",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "watchdog>=5.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
autoyolo = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
